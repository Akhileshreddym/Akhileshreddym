name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Akhileshreddym
          outputs: |
            dist/snake.svg?color_snake=%230d0d0d&color_dots=%23f0f0f0,%23c4c4c4,%238a8a8a,%234a4a4a,%230d0d0d
            dist/snake-dark.svg?color_snake=%23d4d4d4&color_dots=%23161616,%232a2a2a,%234a4a4a,%238a8a8a,%23d4d4d4

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
